<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#140d16">
<title>Интерактивное поздравление 💌</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=Lora:wght@400;600&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap');
:root{--pink:#f7d3d7;--ink:#513641;--soft:#f7e4e5}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{min-height:100vh;color:#fff7f3;font-family:'DM Sans',system-ui,sans-serif;background:#120c17;overflow-x:hidden;-webkit-font-smoothing:antialiased}
.bg{position:fixed;inset:0;z-index:0;background:radial-gradient(ellipse at 50% 0%,rgba(255,219,194,.3),transparent 43%),radial-gradient(ellipse at 8% 42%,rgba(201,105,145,.3),transparent 42%),radial-gradient(ellipse at 90% 72%,rgba(177,124,167,.2),transparent 43%),linear-gradient(145deg,#422436,#291a2b 52%,#17111f)}
#particles{position:fixed;inset:0;z-index:1;pointer-events:none;overflow:hidden}
.spark{position:absolute;color:#ffe1ec;opacity:.5;text-shadow:0 0 8px rgba(255,225,193,.9);animation:tw 4s ease-in-out infinite alternate}
@keyframes tw{from{opacity:.15;transform:scale(.7)}to{opacity:.8;transform:scale(1.25) rotate(35deg)}}
#lock{position:fixed;inset:0;z-index:100;background:radial-gradient(ellipse at 50% 28%,#603747,#2a1b29 54%,#17111f);display:flex;align-items:center;justify-content:center;padding:20px;transition:opacity .8s,visibility .8s}
#lock.hidden{opacity:0;visibility:hidden}
.lock-box{background:rgba(255,232,224,.08);border:1px solid rgba(255,222,220,.18);padding:44px 28px;border-radius:24px;text-align:center;max-width:400px;width:100%;box-shadow:0 30px 60px rgba(0,0,0,.6);backdrop-filter:blur(20px)}
.lock-box .ic{font-size:40px;margin-bottom:16px}
.lock-box h2{font:600 26px 'Playfair Display',serif;color:var(--pink);margin-bottom:10px}
.lock-box p{color:var(--soft);font-size:14px;margin-bottom:22px}
.lock-input{width:100%;padding:16px 20px;border-radius:30px;border:1px solid rgba(255,255,255,.15);background:rgba(0,0,0,.25);color:#fff;font-size:16px;text-align:center;outline:none;margin-bottom:14px}
.lock-input.error{border-color:#ff4d4d;animation:sh .4s}
@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.pbtn,.btn,.submit{border:0;border-radius:30px;color:#fff;font:700 16px 'DM Sans',sans-serif;cursor:pointer;background:linear-gradient(135deg,#f0a8b9,#d15175);padding:16px;width:100%;box-shadow:0 10px 25px -5px rgba(209,81,117,.5);transition:transform .25s}
.pbtn:hover,.submit:hover{transform:translateY(-2px)}
.submit:disabled{opacity:.6;cursor:wait}
.lock-err{color:#ff6b6b;font-size:13px;margin-top:12px;height:18px;opacity:0;transition:.3s}
.lock-err.show{opacity:1}
main{width:min(100% - 32px,820px);margin:auto;text-align:center;position:relative;z-index:2;padding:clamp(40px,8vw,90px) 0 50px}
.kicker{display:inline-block;border:1px solid rgba(255,226,211,.3);border-radius:40px;padding:10px 18px;color:#f1c4cf;font-size:10px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;background:rgba(255,255,255,.04)}
h1{font:700 clamp(40px,9vw,80px)/1 'Playfair Display',serif;margin:28px 0 16px;letter-spacing:-.03em;text-shadow:0 2px 0 #d99bad,0 4px 0 #9d5d76,0 8px 18px rgba(16,7,16,.5)}
h1 em{color:#ffd0df;font-style:italic}
.lead{max-width:500px;margin:0 auto;color:var(--soft);line-height:1.8}
.hint{max-width:440px;margin:14px auto 0;color:#f4d6dd;font:italic 14px/1.6 'Lora',serif}
.scene{height:380px;display:grid;place-items:center;perspective:1500px;margin-top:16px}
.env{position:relative;width:min(380px,88vw);height:240px;cursor:pointer;transform-style:preserve-3d;transition:transform .6s;filter:drop-shadow(0 40px 40px rgba(0,0,0,.45));outline:none}
.env:hover{transform:translateY(-8px) rotateX(5deg)}
.env-body{position:absolute;inset:0;border-radius:12px;background:linear-gradient(135deg,#ffe1d9,#e8a4b2 48%,#b96f83);transform-style:preserve-3d}
.pocket{position:absolute;inset:0;background:linear-gradient(150deg,#f8c8c9,#ce8293);clip-path:polygon(0 100%,0 0,50% 58%,100% 0,100% 100%);z-index:4;border-radius:12px}
.flap{position:absolute;left:0;top:0;width:100%;height:60%;background:linear-gradient(160deg,#fff0df,#f0bdc4 50%,#ce8999);clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top center;transition:transform 1s;z-index:6;backface-visibility:hidden;border-radius:12px 12px 0 0}
.seal{position:absolute;z-index:7;left:50%;top:55%;transform:translate(-50%,-50%);width:60px;height:60px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 30% 25%,#ffe6c5,#d77689 55%,#8f455f);color:#fff;font-size:26px;transition:opacity .4s,transform .6s}
.peek{position:absolute;z-index:2;left:4%;bottom:4%;width:92%;height:92%;background:linear-gradient(160deg,#fffcf6,#f3e5dd);border-radius:8px;display:grid;place-content:center;gap:10px;transition:transform 1.2s}
.peek b{font:700 clamp(24px,4.5vw,32px) 'Playfair Display',serif;color:#883b58}
.peek small{letter-spacing:.16em;font-size:10px;text-transform:uppercase;color:#a77c82;font-weight:600}
.env.open .flap{transform:rotateX(180deg);z-index:1}
.env.open .peek{transform:translateY(-160px) translateZ(20px);z-index:8;transition-delay:.15s}
.env.open .seal{opacity:0;transform:translate(-50%,-50%) scale(.3)}
.tap{font-size:12px;letter-spacing:.2em;color:#f0c7d1;text-transform:uppercase;font-weight:600;animation:pl 2.4s infinite}
@keyframes pl{50%{opacity:.4}}
.progress{display:none;margin:16px auto 0;color:#ffe5db;font-weight:600;font-size:13px}
.progress.on{display:block}
.note{max-height:0;opacity:0;overflow:hidden;transform:translateY(40px);filter:blur(10px);transition:opacity 1s,transform 1s,filter 1s}
body.opened .note{max-height:none;opacity:1;transform:none;filter:none;transition-delay:.8s}
body.opened .rv{animation:rv .85s cubic-bezier(.2,.75,.2,1) var(--d,0s) both}
@keyframes rv{from{opacity:0;transform:translateY(18px);filter:blur(6px)}}
.paper{position:relative;max-width:640px;margin:0 auto;background:linear-gradient(150deg,#fffaf2,#f9e9e5 56%,#f4e5e8);color:var(--ink);border-radius:24px;padding:clamp(24px,6.5vw,56px);text-align:left;box-shadow:0 36px 90px -24px rgba(12,5,14,.7)}
.paper::before{content:"";position:absolute;inset:10px;border:1px solid rgba(215,167,160,.55);border-radius:15px;pointer-events:none}
.salute{text-align:center;font:italic 16px 'Playfair Display',serif;color:#a35a70;margin-bottom:8px}
.paper h2{text-align:center;font:700 clamp(30px,6vw,44px)/1.1 'Playfair Display',serif;color:#8b3652;margin-bottom:26px}
.paper p{font:clamp(16px,2.4vw,18px)/1.9 'Lora',serif;margin-bottom:18px;color:#4a2e38}
.aside{margin:22px 0;padding:16px 20px;border-left:3px solid #d98da0;background:rgba(248,236,230,.6);border-radius:0 10px 10px 0;color:#77515c;font:15px/1.85 'Lora',serif}
.sign{font:italic 24px 'Playfair Display',serif!important;text-align:right;color:#943d5a}
.sign span{display:block;font:600 10px 'DM Sans',sans-serif;letter-spacing:.18em;text-transform:uppercase;margin-top:8px;color:#a77c82}
.hh{display:inline-grid;place-items:center;width:38px;height:40px;margin:-4px 1px;border:0;border-radius:50%;color:#b85d79;background:transparent;font:700 20px/1 'DM Sans',sans-serif;cursor:pointer;vertical-align:middle;transition:transform .2s}
.hh:hover{transform:scale(1.18) rotate(-8deg);background:rgba(222,151,168,.18)}
.hh.found{color:#a04c67;text-shadow:0 0 12px rgba(211,136,150,.8)}
.div{text-align:center;color:#b78178;letter-spacing:.85em;margin:20px 0}
.scratch{max-width:520px;margin:28px auto 40px;text-align:center}
.scratch h3{margin-bottom:12px;color:#91465f;font:600 20px 'Playfair Display',serif}
.s-card{position:relative;min-height:200px;display:grid;place-items:center;overflow:hidden;border:1px solid rgba(208,151,158,.5);border-radius:22px;background:linear-gradient(145deg,#fffdf6,#f8e3e4 60%,#f1dfe9)}
.s-msg{padding:32px 22px;color:#8c3e5d;font:700 clamp(24px,5vw,36px)/1.3 'Playfair Display',serif}
#sc{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair;transition:opacity .65s;user-select:none;-webkit-user-select:none}
#sc.done{opacity:0;pointer-events:none}
.s-ins{margin-top:10px;color:#956a78;font:italic 13px 'Lora',serif}
.qbox{margin-top:44px;padding-top:34px;border-top:1px dashed rgba(201,137,145,.55);text-align:center}
.qbox>h3,.date h3{font:600 clamp(23px,4vw,28px) 'Playfair Display',serif;color:#85445b;margin-bottom:22px}
.comp{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:26px;padding:16px;border:1px solid rgba(202,133,146,.3);border-radius:16px;background:rgba(255,255,255,.7);text-align:left}
.comp p{margin:0!important;font:italic 15px/1.6 'Lora',serif!important;color:#79505d!important}
.comp button{flex:0 0 50px;height:50px;border:0;border-radius:50%;color:#fff;font-size:22px;cursor:pointer;background:radial-gradient(circle at 30% 25%,#ffe8d7,#e596a8 57%,#bb627b)}
.qi{margin-bottom:24px;text-align:left;background:rgba(255,255,255,.7);padding:22px;border-radius:18px;border:1px solid rgba(223,185,183,.6)}
.qq{font:600 18px/1.5 'Lora',serif;color:#8b3652;margin-bottom:14px}
.opt{display:block;width:100%;text-align:left;margin-bottom:10px;padding:14px 16px;border-radius:12px;border:1px solid rgba(230,168,183,.55);background:#fff;color:#a35a70;font:15px/1.5 'Lora',serif;cursor:pointer}
.opt.sel{background:#fdf2f5;border-color:#d98da0;color:#8b3652;font-weight:600}
.qi input,.free textarea,.date textarea{width:100%;padding:14px 16px;border-radius:12px;border:1px solid #e6a8b7;background:#fff;font:16px 'DM Sans',sans-serif;color:#4a2e38;outline:none}
.free{margin-top:26px;text-align:left}
.free label{display:block;font:600 15px 'DM Sans',sans-serif;color:#8b3652;margin-bottom:10px}
.free textarea,.date textarea{min-height:100px;resize:vertical}
.submit{margin-top:22px;background:linear-gradient(135deg,#d98da0,#b94e70)}
.ok{display:none;margin-top:20px;padding:20px;border-radius:16px;background:linear-gradient(145deg,#fff7ee,#f6e2e3);color:#704655;font:italic 16px/1.75 'Lora',serif;text-align:center}
.date{margin:40px auto 8px;padding:26px 20px;border:1px solid rgba(215,167,160,.6);border-radius:20px;background:rgba(255,250,243,.9);text-align:center}
.date>p{margin:-10px 0 18px!important;color:#896976!important;font:italic 14px 'Lora',serif!important}
.dopts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dopt{min-height:84px;padding:12px 8px;border:1px solid rgba(213,166,174,.6);border-radius:15px;background:#fff;color:#8e586b;font:600 14px 'DM Sans',sans-serif;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.dopt i{font-style:normal;font-size:23px}
.dopt.sel{border-color:#b96580;background:#f8e2e7;color:#7e3854;transform:translateY(-2px)}
.dopt:last-child{grid-column:1/-1}
.date textarea{display:none;margin-top:12px}
.dstat{min-height:1.5em;margin-top:10px;color:#80576a;font-size:13px}
.coupon{display:none;margin:20px auto 0;max-width:620px;padding:24px 20px;border:1px dashed rgba(163,91,107,.6);border-radius:16px;background:linear-gradient(135deg,#fff9ec,#f6dfe0 58%,#f3e2d2);color:#76535e;text-align:center}
.coupon small{display:block;margin-bottom:8px;color:#a76573;font:700 10px 'DM Sans',sans-serif;letter-spacing:.22em;text-transform:uppercase}
.coupon strong{display:block;margin-bottom:10px;color:#8b405d;font:700 clamp(24px,5vw,32px) 'Playfair Display',serif}
.coupon p{font:italic 15px/1.7 'Lora',serif}
.coupon button{margin-top:16px;padding:12px 22px;border:0;border-radius:30px;color:#fff;background:linear-gradient(135deg,#d38b9a,#a95372);font:600 13px 'DM Sans',sans-serif;cursor:pointer}
.actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:30px}
.btn{width:auto;padding:14px 26px;font-size:12px;letter-spacing:.09em}
.btn.ghost{background:rgba(255,255,255,.06);border:1px solid rgba(230,168,183,.5);color:#f8dce3;box-shadow:none}
footer{margin-top:50px;color:#b99aa8;font-size:10px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;opacity:.7}
.cf{position:fixed;pointer-events:none;z-index:20;font-size:24px;animation:pop 1.6s cubic-bezier(.15,.7,.3,1) forwards}
@keyframes pop{0%{opacity:0;transform:scale(.4)}15%{opacity:1}100%{opacity:0;transform:translate(var(--x),var(--y)) rotate(60deg) scale(1.4)}}
@media(max-width:480px){.scene{height:285px}.env{height:180px}.env.open .peek{transform:translateY(-118px)}.btn{width:100%}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important}}
</style>
</head>
<body>
<div class="bg"></div>
<div id="particles" aria-hidden="true"></div>
<div id="lock"><div class="lock-box">
  <div class="ic">🔒</div><h2 id="lockTitle"></h2><p id="lockHint"></p>
  <input type="password" id="pw" class="lock-input" placeholder="Введи слово..." autocomplete="off">
  <button id="unlock" class="pbtn">Открыть конверт</button>
  <div class="lock-err" id="lockErr">Не то слово, попробуй ещё раз 🙈</div>
</div></div>
<main id="app"></main>

<script>
/* ═══════════ ВСЁ, ЧТО МЕНЯЕТСЯ ПОД КЛИЕНТА, — ЗДЕСЬ ═══════════ */
const CONFIG = {
  siteId: 'demo',                                   // должен быть в SITES воркера
  workerUrl: 'https://throbbing-cloud-c7a0.dimasarafanov85.workers.dev/',     // URL воркера
  password: '123',
  lockTitle: 'Это личное письмо',
  lockHint: 'Введи кодовое слово (для демо: 123)',
  toName: 'Маша',
  toNameOf: 'Маши',                                 // «от Маши» — для сообщений в Telegram
  kicker: 'секретная доставка чувств',
  lead: 'Тут кое-что важное. Не переживай, экзамена не будет.<br>Просто нажми на конверт. ❤️',
  envelopeTitle: 'Для Маши',
  tapText: '↑ нажми сюда ↑',
  salute: 'моему дорогому человеку',
  title: 'Маша, привет ❤️',
  // [*] — спрятанное сердечко. {aside:'...'} — выделенный блок.
  letter: [
    'Маша, ты стала для меня очень важным человеком. Я долго думал, как сказать об этом, и решил — лучше сделать это красиво.',
    'Помню, как мы начали общаться: я не ждал ничего особенного, а потом поймал себя на мысли, что жду твоих сообщений. [*]',
    'С тобой легко. Мы быстро нашли общий язык, и даже молчать рядом приятно. Иногда мне хватает пары твоих фраз, чтобы день стал лучше.',
    {aside: 'Ты тёплый и настоящий человек, и мне повезло, что наши пути пересеклись. Если тебе когда-нибудь будет грустно — просто напиши. [*]'},
    'Я не хочу торопить события. Мне важно, чтобы всё было по-настоящему, и поэтому я просто хочу, чтобы ты знала, как много ты для меня значишь. [*]',
    'Надеюсь, ты улыбнулась, пока читала. Это было главной целью.'
  ],
  signature: 'Твой человек',
  signatureSub: 'который очень тобой дорожит',
  scratchTitle: 'Маленький секрет для тебя 💌',
  scratchText: 'Ты очень особенная,<br>и я рад, что ты есть 💗',
  quizTitle: 'Мини-игра на память 🤭',
  quiz: [
    {q: '1. О чём я подумал, когда мы только познакомились?', options: ['Интересно, о чём она думает', 'Какая у неё классная улыбка', 'Надо срочно придумать шутку']},
    {q: '2. Что я чувствовал после нашей первой встречи?', options: ['Просто усталость', 'Лёгкость и хорошее настроение', 'Думал, что бы съесть']},
    {q: '3. Какая моя любимая черта в тебе?', options: ['Улыбка', 'Чувство юмора', 'Доброта и искренность']}
  ],
  freeLabel: 'Хочешь что-то добавить от себя? (необязательно)',
  dateTitle: 'А теперь — наше свидание? 💕',
  dateSub: 'Выбирай, куда тебе хотелось бы сходить вместе',
  dates: [['⛸️', 'Каток'], ['🍰', 'Ресторан'], ['🎡', 'Парк аттракционов'], ['🌙', 'Просто погулять']],
  couponTitle: 'Купон на объятие 🤗',
  couponNote: 'Предъяви этот купон при встрече и получи одно крепкое, тёплое объятие. Действует всегда 💌',
  thanks: 'Спасибо, что ответила 💌 Ты мне очень дорога. Обнимаю мысленно 🤗',
  compliments: [
    'Твоя улыбка делает даже обычный день теплее.',
    'С тобой легко смеяться и приятно молчать.',
    'В тебе есть редкое сочетание доброты и искренности.',
    'Мне повезло, что наши дороги пересеклись.'
  ],
  footer: 'ДЕМО-ВЕРСИЯ · СДЕЛАНО С ЛЮБОВЬЮ'
};
/* ═══════════════════════════════════════════════════════════ */

(() => {
  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let delay = 0.05; const d = () => `style="--d:${(delay += 0.12).toFixed(2)}s"`;
  let hearts = 0;
  const withHearts = t => esc(t).split('[*]').map((part, i, a) =>
    part + (i < a.length - 1 ? `<button class="hh" type="button" data-h aria-label="Спрятанное сердечко">♥</button>` : '')).join('');

  $('lockTitle').textContent = CONFIG.lockTitle;
  $('lockHint').textContent = CONFIG.lockHint;
  document.title = CONFIG.toName + ', у меня к тебе кое-что… 💌';

  const letter = CONFIG.letter.map(x => typeof x === 'string'
    ? `<p class="rv" ${d()}>${withHearts(x)}</p>`
    : `<div class="aside rv" ${d()}>${withHearts(x.aside)}</div>`).join('');
  hearts = (JSON.stringify(CONFIG.letter).match(/\[\*\]/g) || []).length;

  const quiz = CONFIG.quiz.map((it, i) => `
    <div class="qi rv" ${d()}><div class="qq">${esc(it.q)}</div>
      ${it.options.map(o => `<button type="button" class="opt" data-q="${i}">${esc(o)}</button>`).join('')}
      <input type="text" data-own="${i}" placeholder="Или свой вариант...">
    </div>`).join('');

  $('app').innerHTML = `
    <div class="kicker">${esc(CONFIG.kicker)}</div>
    <h1>Эй, <em>${esc(CONFIG.toName)}…</em></h1>
    <p class="lead">${CONFIG.lead}</p>
    ${hearts ? `<p class="hint">В письме спрятаны сердечки (${hearts}) — найди все, и тебя ждёт сюрприз 💌</p>` : ''}
    <div class="scene"><div class="env" id="env" role="button" tabindex="0" aria-label="Открыть письмо" aria-expanded="false">
      <div class="env-body"><div class="peek"><b>${esc(CONFIG.envelopeTitle)}</b><small>открыть и улыбнуться</small></div>
      <div class="flap"></div><div class="pocket"></div><div class="seal">♥</div></div></div></div>
    <div class="tap" id="tap">${esc(CONFIG.tapText)}</div>
    <div class="progress" id="progress" aria-live="polite"></div>
    <section class="note" id="note" aria-hidden="true">
      <article class="paper">
        <p class="salute rv" ${d()}>${esc(CONFIG.salute)}</p>
        <h2 class="rv" ${d()}>${esc(CONFIG.title)}</h2>
        ${letter}
        <p class="sign rv" ${d()}>${esc(CONFIG.signature)} <span>${esc(CONFIG.signatureSub)}</span></p>
        <div class="div rv" ${d()}>✦ ✧ ✦</div>
        <section class="scratch rv" ${d()}><h3>${esc(CONFIG.scratchTitle)}</h3>
          <div class="s-card"><div class="s-msg">${CONFIG.scratchText}</div>
          <canvas id="sc" tabindex="0" role="button" aria-label="Сотри розовый слой"></canvas></div>
          <p class="s-ins" id="sIns">Проведи пальцем или мышкой по розовому слою ✨</p></section>
        <div class="qbox"><h3 class="rv" ${d()}>${esc(CONFIG.quizTitle)}</h3>
          <div class="comp rv" ${d()}><p id="compText">Для тебя есть маленькая открытка. Нажми на сердечко 💌</p><button id="compBtn" type="button" aria-label="Комплимент">♥</button></div>
          ${quiz}
          <div class="free rv" ${d()}><label for="free">${esc(CONFIG.freeLabel)}</label><textarea id="free" placeholder="Напиши здесь, если хочешь..."></textarea></div>
          <button class="submit" id="sendQuiz" type="button">Отправить ответы</button>
          <div class="ok" id="ok"></div>
        </div>
        <section class="date rv" ${d()}><h3>${esc(CONFIG.dateTitle)}</h3><p>${esc(CONFIG.dateSub)}</p>
          <div class="dopts">${CONFIG.dates.map(x => `<button type="button" class="dopt" data-date="${esc(x[1])}"><i>${x[0]}</i>${esc(x[1])}</button>`).join('')}
          <button type="button" class="dopt" data-date="__own"><i>✍️</i>Свой вариант</button></div>
          <textarea id="ownDate" maxlength="500" placeholder="Твоя идея для свидания..."></textarea>
          <button class="submit" id="sendDate" type="button">Отправить мой выбор 💌</button>
          <div class="dstat" id="dstat" aria-live="polite"></div></section>
      </article>
      <div class="actions"><button class="btn" id="burstBtn" type="button">Отправить сердечки 💗</button>
        <button class="btn ghost" id="closeBtn" type="button">Спрятать письмо</button></div>
    </section>
    <footer>${esc(CONFIG.footer)}</footer>
    <div class="coupon" id="coupon"><small>секретная награда</small><strong>${esc(CONFIG.couponTitle)}</strong>
      <p>${esc(CONFIG.couponNote)}</p><button id="couponBtn" type="button">Погасить при встрече 🤗</button></div>`;

  /* пароль */
  function unlock() {
    if ($('pw').value.trim().toLowerCase() === String(CONFIG.password).toLowerCase()) {
      $('lock').classList.add('hidden'); setTimeout(() => $('lock').style.display = 'none', 800);
    } else {
      $('pw').classList.add('error'); $('lockErr').classList.add('show');
      setTimeout(() => $('pw').classList.remove('error'), 500);
    }
  }
  $('unlock').onclick = unlock;
  $('pw').onkeydown = e => { if (e.key === 'Enter') unlock(); };
  $('pw').oninput = () => $('lockErr').classList.remove('show');

  /* конверт */
  const env = $('env');
  function openLetter() {
    if (document.body.classList.contains('opened')) return;
    env.classList.add('open'); env.setAttribute('aria-expanded', 'true');
    document.body.classList.add('opened'); $('note').setAttribute('aria-hidden', 'false');
    $('tap').textContent = 'ну всё… теперь самое главное 💌';
    setTimeout(paint, 900);
    setTimeout(() => $('note').scrollIntoView({behavior: reduced ? 'auto' : 'smooth', block: 'start'}), 700);
    burst(30);
  }
  env.onclick = openLetter;
  env.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openLetter(); } };
  $('closeBtn').onclick = () => {
    env.classList.remove('open'); env.setAttribute('aria-expanded', 'false');
    document.body.classList.remove('opened'); $('note').setAttribute('aria-hidden', 'true');
    $('tap').textContent = CONFIG.tapText; scrollTo({top: 0, behavior: reduced ? 'auto' : 'smooth'});
  };
  $('burstBtn').onclick = () => burst(40);

  /* сердечки-квест */
  document.querySelectorAll('[data-h]').forEach(h => h.onclick = () => {
    if (h.classList.contains('found')) return;
    h.classList.add('found'); burst(10);
    const n = document.querySelectorAll('[data-h].found').length;
    $('progress').textContent = `Найдено сердечек: ${n} из ${hearts}`; $('progress').classList.add('on');
    if (n === hearts) { $('coupon').style.display = 'block'; $('coupon').scrollIntoView({behavior: reduced ? 'auto' : 'smooth', block: 'center'}); burst(30); }
  });
  $('couponBtn').onclick = e => { e.target.textContent = 'Купон активирован — обнимаю! 🤗'; e.target.disabled = true; burst(24); };

  /* комплименты */
  let lastC = -1;
  $('compBtn').onclick = () => {
    let n = Math.floor(Math.random() * CONFIG.compliments.length);
    if (CONFIG.compliments.length > 1 && n === lastC) n = (n + 1) % CONFIG.compliments.length;
    lastC = n; $('compText').textContent = CONFIG.compliments[n]; burst(8);
  };

  /* скретч */
  const sc = $('sc'), ctx = sc.getContext('2d'); let drawing = false, last = null;
  function paint() {
    const r = sc.getBoundingClientRect(); if (!r.width) return;
    const k = Math.min(devicePixelRatio || 1, 3);
    sc.width = r.width * k; sc.height = r.height * k; ctx.setTransform(k, 0, 0, k, 0, 0);
    const g = ctx.createLinearGradient(0, 0, r.width, r.height);
    g.addColorStop(0, '#e6a7b7'); g.addColorStop(.5, '#ce829b'); g.addColorStop(1, '#ac637f');
    ctx.globalCompositeOperation = 'source-over'; ctx.fillStyle = g; ctx.fillRect(0, 0, r.width, r.height);
    ctx.fillStyle = 'rgba(255,248,238,.95)'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = '700 13px "DM Sans",Arial'; ctx.fillText('ТУТ ЕСТЬ МАЛЕНЬКИЙ СЕКРЕТ', r.width / 2, r.height / 2 - 12);
    ctx.font = 'italic 15px Georgia'; ctx.fillText('сотри розовый слой пальцем ✨', r.width / 2, r.height / 2 + 16);
  }
  function reveal() { if (sc.classList.contains('done')) return; sc.classList.add('done'); $('sIns').textContent = 'Секрет открыт 💗'; burst(18); }
  function scratch(x, y) {
    const r = sc.getBoundingClientRect(), p = {x: x - r.left, y: y - r.top};
    ctx.globalCompositeOperation = 'destination-out'; ctx.lineWidth = 58; ctx.lineCap = ctx.lineJoin = 'round';
    ctx.beginPath(); if (last) { ctx.moveTo(last.x, last.y); ctx.lineTo(p.x, p.y); ctx.stroke(); } else { ctx.arc(p.x, p.y, 29, 0, 7); ctx.fill(); }
    last = p;
  }
  function check() {
    const w = sc.width, h = sc.height; if (!w) return;
    const px = ctx.getImageData(0, 0, w, h).data; let t = 0, e = 0;
    for (let y = 10; y < h; y += 20) for (let x = 10; x < w; x += 20) { t++; if (px[(y * w + x) * 4 + 3] < 80) e++; }
    if (t && e / t >= .38) reveal();
  }
  const stop = () => { if (!drawing) return; drawing = false; last = null; check(); };
  sc.addEventListener('pointerdown', e => { if (sc.classList.contains('done')) return; e.preventDefault(); drawing = true; last = null; sc.setPointerCapture(e.pointerId); scratch(e.clientX, e.clientY); });
  sc.addEventListener('pointermove', e => { if (drawing) scratch(e.clientX, e.clientY); });
  sc.addEventListener('pointerup', stop); sc.addEventListener('pointercancel', stop);
  sc.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); reveal(); } };
  paint();

  /* квиз: выбор варианта */
  document.querySelectorAll('.opt').forEach(b => b.onclick = () => {
    document.querySelectorAll(`.opt[data-q="${b.dataset.q}"]`).forEach(x => x.classList.toggle('sel', x === b));
  });

  /* отправка в воркер */
  async function send(text) {
    const res = await fetch(CONFIG.workerUrl, {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({siteId: CONFIG.siteId, text})});
    const data = await res.json().catch(() => ({}));
    if (!res.ok || !data.ok) throw new Error(data.description || 'send failed');
  }
  $('sendQuiz').onclick = async e => {
    const btn = e.currentTarget; btn.disabled = true; btn.textContent = 'Отправка...';
    let msg = `Ответы от ${CONFIG.toNameOf} 💌\n\n`;
    CONFIG.quiz.forEach((it, i) => {
      const sel = document.querySelector(`.opt.sel[data-q="${i}"]`);
      const own = document.querySelector(`[data-own="${i}"]`).value.trim();
      msg += `${it.q}\n→ ${own ? 'Свой вариант: ' + own : (sel ? sel.textContent : 'не ответила')}\n\n`;
    });
    const free = $('free').value.trim(); if (free) msg += `💬 Её сообщение:\n${free}`;
    try {
      await send(msg);
      $('ok').textContent = CONFIG.thanks; $('ok').style.display = 'block';
      $('ok').scrollIntoView({behavior: 'smooth', block: 'center'}); btn.textContent = 'Отправлено ✓'; burst(60);
    } catch { btn.disabled = false; btn.textContent = 'Не получилось, нажми ещё раз'; }
  };

  /* свидание */
  let dateChoice = null;
  document.querySelectorAll('.dopt').forEach(b => b.onclick = () => {
    dateChoice = b.dataset.date;
    document.querySelectorAll('.dopt').forEach(x => x.classList.toggle('sel', x === b));
    $('ownDate').style.display = dateChoice === '__own' ? 'block' : 'none'; $('dstat').textContent = '';
  });
  $('sendDate').onclick = async e => {
    const btn = e.currentTarget;
    if (!dateChoice) { $('dstat').textContent = 'Сначала выбери, куда тебе хочется 💗'; return; }
    let choice = dateChoice;
    if (choice === '__own') { choice = $('ownDate').value.trim(); if (!choice) { $('dstat').textContent = 'Напиши свой вариант ✍️'; return; } }
    btn.disabled = true; btn.textContent = 'Отправляю…';
    try {
      await send(`Выбор свидания от ${CONFIG.toNameOf} 💌\n\nОна выбрала: ${choice}`);
      $('dstat').textContent = 'Ура, я получил твой выбор. Уже жду наше свидание 💕'; btn.textContent = 'Выбор отправлен ✓'; burst(22);
    } catch { $('dstat').textContent = 'Не получилось отправить. Проверь интернет и попробуй ещё раз.'; btn.disabled = false; btn.textContent = 'Отправить мой выбор 💌'; }
  };

  /* эффекты */
  function burst(n) {
    if (reduced) return;
    const s = ['♥', '♡', '✦', '💗', '💕'];
    for (let i = 0; i < n; i++) {
      const el = document.createElement('span'); el.className = 'cf';
      el.textContent = s[Math.floor(Math.random() * s.length)];
      el.style.left = (35 + Math.random() * 30) + 'vw'; el.style.top = (40 + Math.random() * 20) + 'vh';
      el.style.setProperty('--x', (Math.random() * 400 - 200) + 'px'); el.style.setProperty('--y', (-120 - Math.random() * 400) + 'px');
      el.style.animationDelay = (Math.random() * .4) + 's';
      document.body.appendChild(el); setTimeout(() => el.remove(), 2200);
    }
  }
  const frag = document.createDocumentFragment();
  for (let i = 0; i < 36; i++) {
    const s = document.createElement('span'); s.className = 'spark'; s.textContent = Math.random() > .5 ? '✦' : '·';
    s.style.cssText = `left:${Math.random() * 100}%;top:${Math.random() * 100}%;font-size:${8 + Math.random() * 15}px;animation-delay:${Math.random() * 8}s;animation-duration:${6 + Math.random() * 6}s`;
    frag.appendChild(s);
  }
  $('particles').appendChild(frag);
})();
</script>
</body>
</html>
